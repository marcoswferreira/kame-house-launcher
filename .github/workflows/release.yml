name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    name: Build & Package (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            binary_name: kame-house-launcher
            archive_name: kame-house-launcher-linux-x86_64.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            binary_name: kame-house-launcher.exe
            archive_name: kame-house-launcher-windows-x86_64.zip
    steps:
      - name: Enable Long Paths on Windows
        if: runner.os == 'Windows'
        run: git config --system core.longpaths true

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build Release Binary
        run: cargo build --workspace --release --target ${{ matrix.target }}

      - name: Package Linux Archive
        if: runner.os == 'Linux'
        run: |
          mkdir -p release-pkg
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} release-pkg/
          cp LICENSE README.md release-pkg/
          tar -czvf ${{ matrix.archive_name }} -C release-pkg .
          sha256sum ${{ matrix.archive_name }} > ${{ matrix.archive_name }}.sha256

      - name: Package Windows Archive
        if: runner.os == 'Windows'
        shell: bash
        run: |
          mkdir -p release-pkg
          cp target/${{ matrix.target }}/release/${{ matrix.binary_name }} release-pkg/
          cp LICENSE README.md release-pkg/
          7z a ${{ matrix.archive_name }} ./release-pkg/*
          sha256sum ${{ matrix.archive_name }} > ${{ matrix.archive_name }}.sha256

      - name: Upload Release Assets
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            ${{ matrix.archive_name }}
            ${{ matrix.archive_name }}.sha256
          draft: false
          prerelease: false
          generate_release_notes: true

